const $=id=>document.getElementById(id);
function tr(k){return T[lang][k]||k}
function money(n){n=Number(n)||0;try{return new Intl.NumberFormat(lang==='zh'?'zh-HK':'en-CA',{style:'currency',currency:(currentEvent()?.currency||'CAD'),minimumFractionDigits:(currentEvent()?.currency||'CAD')==='JPY'?0:2,maximumFractionDigits:(currentEvent()?.currency||'CAD')==='JPY'?0:2}).format(n)}catch{return n.toFixed(2)}}
function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(err){
    console.error('FriendSplit storage error',err);
    return false;
  }
}
function initials(n){return n.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function num(id){return parseFloat($(id).value)||0}
function render(){document.querySelectorAll('[data-t]').forEach(x=>x.textContent=tr(x.dataset.t));renderEvents();if(currentEventId)renderEvent()}

function formatMoney(n,c){n=Number(n)||0;try{return new Intl.NumberFormat(lang==='zh'?'zh-HK':'en-CA',{style:'currency',currency:c||'CAD',minimumFractionDigits:c==='JPY'?0:2,maximumFractionDigits:c==='JPY'?0:2}).format(n)}catch{return n.toFixed(2)}}

function backToEvents(){currentEventId=null;state.currentEventId=null;persist();$('eventView').classList.add('hidden');$('eventsView').classList.remove('hidden');renderEvents()}

function renderBalances(){let e=currentEvent();if(!e)return;let b=balances(),me=e.members.includes('Kitty')?'Kitty':e.members[0],v=b[me]||0;$('net').textContent=(v>=0?'+ ':'- ')+money(Math.abs(v));$('owed').textContent=money(Math.max(v,0));$('owe').textContent=money(Math.max(-v,0));let debtors=[],creditors=[];Object.entries(b).forEach(([n,x])=>{if(x<-0.005)debtors.push([n,-x]);if(x>0.005)creditors.push([n,x])});let out=[],i=0,j=0;while(i<debtors.length&&j<creditors.length){let amt=Math.min(debtors[i][1],creditors[j][1]);out.push(`${escapeHtml(debtors[i][0])} ${tr('owes')} ${escapeHtml(creditors[j][0])} <b>${money(amt)}</b>`);debtors[i][1]-=amt;creditors[j][1]-=amt;if(debtors[i][1]<.005)i++;if(creditors[j][1]<.005)j++}$('settlements').innerHTML=out.length?out.map(x=>`<div class="balance-line"><span>${x}</span></div>`).join(''):tr('noSettle')}

function resetExpenseForm(){editingId=null;itemDraft=[];taxRuleDraft=[];mode='equal';taxMode='rate';tipMode='rate';$('desc').value='';$('subtotal').value='';$('tax').value='5';$('tip').value='0';$('paidTotal').value='';$('expenseType').value='dining';$('baseTaxOverride').value='';$('receiptTaxTotal').value='';$('receiptSubtotal').value='';$('expenseSheet').querySelector('.panel').classList.remove('editing');$('deleteExpenseBtn').style.display='none';updateExpenseLabels();buildExpenseForm();setMode('equal');setChargeMode('tax','rate',false);setChargeMode('tip','rate',false)}

function buildExpenseForm(selectedNames=null){let previousPayer=$('payer').value;$('payer').innerHTML=currentEvent().members.map(n=>`<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');if(currentEvent().members.includes(previousPayer))$('payer').value=previousPayer;let chosen=selectedNames||currentEvent().members;$('participantChecks').innerHTML=currentEvent().members.map(n=>`<label class="check"><input type="checkbox" value="${escapeAttr(n)}" ${chosen.includes(n)?'checked':''} onchange="buildCustomPreserve();recompute()">${escapeHtml(n)}</label>`).join('');buildCustom()}

function renderItems(){let type=currentExpenseType();$('itemRows').innerHTML=itemDraft.map(x=>{let baseControl=type==='dining'?'':`<div class="tiny" style="margin-top:8px"><label><input type="checkbox" ${x.baseTaxable?'checked':''} onchange="toggleBaseTax(${x.id},this.checked)">${tr('baseTaxApplies')}</label></div>`;let extra=taxRuleDraft.length?`<div class="tiny" style="margin-top:8px"><span>${tr('extraTax')}: </span>${taxRuleDraft.map(r=>`<label style="margin-right:8px"><input type="checkbox" ${x.taxes.includes(r.id)?'checked':''} onchange="toggleItemTax(${x.id},'${r.id}',this.checked)">${escapeHtml(r.name)} ${Number(r.rate)||0}%</label>`).join('')}</div>`:'';return `<div class="itemrow"><div class="itemgrid"><input class="mini" placeholder="${tr('itemName')}" value="${escapeAttr(x.name)}" oninput="updateItem(${x.id},'name',this.value)"><input class="mini" type="number" inputmode="decimal" placeholder="${tr('itemPrice')}" value="${x.price}" oninput="updateItem(${x.id},'price',this.value)"></div><div class="tiny" style="margin-top:8px">${currentEvent().members.map(n=>`<label style="margin-right:8px"><input type="checkbox" ${x.people.includes(n)?'checked':''} onchange="toggleItemPerson(${x.id},'${escapeAttr(n)}',this.checked)">${escapeHtml(n)}</label>`).join('')}</div>${baseControl}${extra}<button class="xbtn" style="margin-top:8px" onclick="removeItem(${x.id})">×</button></div>`}).join('')}
function addTaxRule(){let name=prompt(lang==='zh'?'額外稅名稱，例如 Liquor Tax':'Extra tax name, e.g. Liquor Tax');if(!name)return;let rate=parseFloat(prompt(lang==='zh'?'額外稅率 %':'Extra tax rate %')||0);taxRuleDraft.push({id:'r'+Date.now(),name,rate:isNaN(rate)?0:rate});renderTaxRules();renderItems();preview()}
function removeTaxRule(id){taxRuleDraft=taxRuleDraft.filter(r=>r.id!==id);itemDraft.forEach(x=>x.taxes=x.taxes.filter(t=>t!==id));renderTaxRules();renderItems();preview()}
function renderTaxRules(){$('taxRules').innerHTML=taxRuleDraft.map(r=>`<div class="taxrow"><div class="headrow"><span><b>${escapeHtml(r.name)}</b> · ${Number(r.rate)||0}%</span><button class="xbtn" onclick="removeTaxRule('${r.id}')">×</button></div><label class="tiny">${tr('actualTax')}</label><input class="mini" type="number" inputmode="decimal" placeholder="auto" value="${r.override??''}" oninput="let r=taxRuleDraft.find(z=>z.id==='${r.id}');r.override=this.value;preview()"></div>`).join('')}
function itemCalc(){let base=Object.fromEntries(currentEvent().members.map(n=>[n,0])),extraAuto={};taxRuleDraft.forEach(r=>extraAuto[r.id]=0);let sub=0,taxableSub=0;let baseEligible={};itemDraft.forEach(x=>{let p=parseFloat(x.price)||0;sub+=p;let ppl=x.people.length?x.people:[];ppl.forEach(n=>base[n]=(base[n]||0)+p/ppl.length);let baseApplies=currentExpenseType()==='dining'?true:!!x.baseTaxable;if(baseApplies){taxableSub+=p;ppl.forEach(n=>baseEligible[n]=(baseEligible[n]||0)+p/(ppl.length||1))}x.taxes.forEach(id=>{let r=taxRuleDraft.find(z=>z.id===id);if(r)extraAuto[id]+=p*(Number(r.rate)||0)/100})});let baseAuto=taxMode==='rate'?taxableSub*num('tax')/100:num('tax');let baseOverride=$('baseTaxOverride').value;let baseTaxAmt=baseOverride!==''?(parseFloat(baseOverride)||0):baseAuto;let taxByRule={};taxRuleDraft.forEach(r=>taxByRule[r.id]=(r.override!==undefined&&r.override!=='')?(parseFloat(r.override)||0):extraAuto[r.id]);let extraTaxAmt=Object.values(taxByRule).reduce((a,b)=>a+b,0),taxAmt=baseTaxAmt+extraTaxAmt;let tipAmt=tipMode==='rate'?sub*num('tip')/100:num('tip');let taxShares=Object.fromEntries(currentEvent().members.map(n=>[n,0]));let baseDenom=Object.values(baseEligible).reduce((a,b)=>a+b,0);Object.entries(baseEligible).forEach(([n,v])=>taxShares[n]+=(baseDenom?v/baseDenom:0)*baseTaxAmt);taxRuleDraft.forEach(r=>{let eligible={},denom=0;itemDraft.filter(x=>x.taxes.includes(r.id)).forEach(x=>{let p=parseFloat(x.price)||0;x.people.forEach(n=>{eligible[n]=(eligible[n]||0)+p/(x.people.length||1);denom+=p/(x.people.length||1)})});Object.entries(eligible).forEach(([n,v])=>taxShares[n]+=(denom?v/denom:0)*taxByRule[r.id])});let names=currentEvent().members.filter(n=>(base[n]||0)>0),shares=names.map(n=>({name:n,amount:(base[n]||0)+(taxShares[n]||0)+(sub?(base[n]||0)/sub*tipAmt:0)}));return{sub,taxAmt,baseTaxAmt,baseAuto,extraTaxAmt,tipAmt,total:sub+taxAmt+tipAmt,names,base,shares,taxByRule,taxableSub}}


function calc(){if(mode==='item')return itemCalc();let sub=num('subtotal'),tx=num('tax'),tp=num('tip'),names=selected(),base={};if(mode==='equal'){names.forEach(n=>base[n]=names.length?sub/names.length:0)}else{document.querySelectorAll('.customVal').forEach(x=>base[x.dataset.name]=parseFloat(x.value)||0)}let taxAmt=taxMode==='rate'?sub*tx/100:tx;let tipAmt=tipMode==='rate'?sub*tp/100:tp;let extras=taxAmt+tipAmt,total=sub+extras;return{sub,tx,tp,taxAmt,tipAmt,names,base,total,shares:names.map(n=>({name:n,amount:(base[n]||0)+(sub?((base[n]||0)/sub)*extras:0)}))}}
function backCalculateTip(){let actual=num('paidTotal');if(actual<=0)return false;let c=calc();if(c.sub<=0)return false;let calculated=Math.max(0,actual-c.sub-c.taxAmt);tipMode='amount';$('tip').value=calculated.toFixed(2);$('tipRateBtn').classList.remove('on');$('tipAmountBtn').classList.add('on');return true}
function recompute(){let matched=backCalculateTip();preview(matched)}
function matchTotal(){recompute()}
function getValidation(c){
  let d=$('desc').value.trim(), payer=$('payer').value, sel=selected();
  let required=!!d&&!!payer&&sel.length>0&&c.sub>0;
  let itemsOk=true,itemSumOk=true;
  if(mode==='item'){
    itemsOk=itemDraft.length>0&&itemDraft.every(x=>String(x.name||'').trim()&&(parseFloat(x.price)||0)>0&&Array.isArray(x.people)&&x.people.length>0);
    let itemSum=itemDraft.reduce((a,x)=>a+(parseFloat(x.price)||0),0);
    itemSumOk=$('receiptSubtotal').value===''?true:Math.abs(itemSum-num('receiptSubtotal'))<=0.01;
  }
  let shareSum=(c.shares||[]).reduce((a,x)=>a+(Number(x.amount)||0),0);
  let sharesOk=Math.abs(shareSum-c.total)<=0.02;
  let mathOk=Math.abs((c.sub+c.taxAmt+c.tipAmt)-c.total)<=0.01;
  let taxOk=true;
  if(mode==='item'&&$('receiptTaxTotal').value!=='') taxOk=Math.abs(c.taxAmt-num('receiptTaxTotal'))<=0.01;
  let paidOk=true;
  if($('paidTotal').value!=='') paidOk=Math.abs(c.total-num('paidTotal'))<=0.01;
  if(mode==='custom'){
    let sum=Object.values(c.base).reduce((a,b)=>a+b,0);
    sharesOk=sharesOk&&Math.abs(sum-c.sub)<=0.02;
  }
  return {required,itemsOk,itemSumOk,sharesOk,mathOk,taxOk,paidOk,ok:required&&itemsOk&&itemSumOk&&sharesOk&&mathOk&&taxOk&&paidOk};
}
function checkLine(ok,text){return `<div class="checkline ${ok?'ok':'danger'}"><span class="ico">${ok?'✓':'✕'}</span><span>${text}</span></div>`}
function refreshSaveState(v){let b=$('saveExpenseBtn');b.classList.toggle('save-disabled',!v.ok);b.disabled=!v.ok;$('desc').classList.toggle('field-error',!$('desc').value.trim());$('subtotal').classList.toggle('field-error',mode!=='item'&&num('subtotal')<=0);$('payer').classList.toggle('field-error',!$('payer').value);}
function preview(matched=false){let c=calc();if(mode==='item')$('subtotal').value=c.sub?c.sub.toFixed(2):'';let txPct=c.sub?c.taxAmt/c.sub*100:0,tpPct=c.sub?c.tipAmt/c.sub*100:0;let note=(matched&&num('paidTotal')>0)?`<div class="calc-note good">✓ ${tr('tipCalculated')}: ${money(c.tipAmt)}</div>`:'';let recon='';if(mode==='item'&&$('receiptTaxTotal').value!==''){let receipt=num('receiptTaxTotal'),diff=c.taxAmt-receipt;if(Math.abs(diff)<=0.01)recon=`<div class="calc-note ok">${tr('taxMatch')}</div>`;else recon=`<div class="calc-note warn">${tr('taxMismatch')} ${money(Math.abs(diff))}</div>`}let detail=mode==='item'?`<br><span class="tiny">Base tax: ${money(c.baseTaxAmt||0)} · Extra tax: ${money(c.extraTaxAmt||0)}</span>`:'';let v=getValidation(c);let checks=`<div class="checklist"><b>${tr('checkTitle')}</b>${checkLine(v.required,tr('checkRequired'))}${mode==='item'?checkLine(v.itemsOk,tr('checkItems'))+($('receiptSubtotal').value!==''?checkLine(v.itemSumOk,tr('checkItemSum')):''):''}${checkLine(v.mathOk,tr('checkMath'))}${checkLine(v.sharesOk,tr('checkShares'))}${mode==='item'&&$('receiptTaxTotal').value!==''?checkLine(v.taxOk,tr('checkTax')):''}${$('paidTotal').value!==''?checkLine(v.paidOk,tr('checkPaid')):''}<div class="calc-note ${v.ok?'good':'warn'}">${v.ok?tr('checkReady'):tr('checkNotReady')}</div></div>`;$('preview').innerHTML=`<b>${tr('total')}: ${money(c.total)}</b><br><span class="tiny">Tax: ${money(c.taxAmt)} (${txPct.toFixed(2)}%) · Tip: ${money(c.tipAmt)} (${tpPct.toFixed(2)}%)</span>${detail}${recon}${note}`+(c.names.length?'<br><br>'+c.shares.map(s=>`${escapeHtml(s.name)}: ${money(s.amount)}`).join('<br>'):'')+checks;refreshSaveState(v)}

function editExpense(id){let e=currentEvent().expenses.find(x=>x.id===id);if(!e)return;editingId=id;mode=e.mode||'equal';taxMode=e.taxMode||'rate';tipMode=e.tipMode||'rate';$('expenseSheet').style.display='flex';$('expenseSheet').querySelector('.panel').classList.add('editing');buildExpenseForm(e.participants);$('desc').value=e.desc;$('expenseType').value=e.expenseType||'dining';$('subtotal').value=e.subtotal;$('payer').value=e.payer;$('tax').value=taxMode==='amount'?(e.taxAmt??e.tax):(e.tax??0);$('tip').value=tipMode==='amount'?(e.tipAmt??e.tip):(e.tip??0);$('paidTotal').value=e.paidTotal||'';$('baseTaxOverride').value=e.baseTaxOverride??'';$('receiptTaxTotal').value=e.receiptTaxTotal??'';$('receiptSubtotal').value=e.receiptSubtotal??'';$('equalBtn').classList.toggle('on',mode==='equal');$('customBtn').classList.toggle('on',mode==='custom');$('customArea').classList.toggle('hidden',mode!=='custom');$('itemArea').classList.toggle('hidden',mode!=='item');$('itemBtn').classList.toggle('on',mode==='item');if(mode==='item'){itemDraft=JSON.parse(JSON.stringify(e.items||[]));taxRuleDraft=JSON.parse(JSON.stringify(e.taxRules||[])).filter(r=>r.id!=='gst');itemDraft.forEach(x=>{if(x.baseTaxable===undefined)x.baseTaxable=true;if(x.taxes?.includes('gst'))x.taxes=x.taxes.filter(t=>t!=='gst')});renderItems();renderTaxRules()}setChargeMode('tax',taxMode,false);setChargeMode('tip',tipMode,false);if(mode==='custom'){let vals={};(e.baseShares||[]).forEach(x=>vals[x.name]=x.amount);buildCustom(vals)}$('subtotal').readOnly=(mode==='item');$('subtotal').classList.toggle('readonly',mode==='item');$('itemTaxMeta').classList.toggle('hidden',mode!=='item');$('deleteExpenseBtn').style.display='block';updateExpenseLabels();preview()}
function saveExpense(){let c=calc(),d=$('desc').value.trim(),v=getValidation(c);preview();if(!v.required){alert(tr('invalid'));return}if(mode==='item'&&!v.itemsOk){alert(tr('itemInvalid'));return}if(mode==='custom'){let sum=Object.values(c.base).reduce((a,b)=>a+b,0);if(Math.abs(sum-c.sub)>.02){alert(tr('customMismatch'));return}}if(!v.taxOk){alert(tr('taxMismatchSave'));return}if(!v.paidOk){alert(tr('paidMismatch'));return}if(!v.sharesOk||!v.mathOk){alert(tr('checkNotReady'));return}let record={id:editingId||Date.now(),desc:d,expenseType:currentExpenseType(),items:mode==='item'?itemDraft:null,taxRules:mode==='item'?taxRuleDraft:null,subtotal:c.sub,tax:c.tx,tip:c.tp,taxMode,tipMode,taxAmt:c.taxAmt,tipAmt:c.tipAmt,paidTotal:$('paidTotal').value===''?null:num('paidTotal'),baseTaxOverride:$('baseTaxOverride').value===''?null:num('baseTaxOverride'),receiptTaxTotal:$('receiptTaxTotal').value===''?null:num('receiptTaxTotal'),receiptSubtotal:$('receiptSubtotal').value===''?null:num('receiptSubtotal'),total:c.total,payer:$('payer').value,participants:c.names,shares:c.shares,mode,baseShares:c.names.map(n=>({name:n,amount:c.base[n]||0}))};if(editingId){let idx=currentEvent().expenses.findIndex(x=>x.id===editingId);if(idx>=0)currentEvent().expenses[idx]=record}else currentEvent().expenses.push(record);persist();closeExpense();render()}
function deleteExpense(){if(!editingId)return;if(!confirm(tr('confirmDelete')))return;currentEvent().expenses=currentEvent().expenses.filter(x=>x.id!==editingId);persist();closeExpense();render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
$('subtotal').addEventListener('input',recompute);$('tax').addEventListener('input',recompute);$('tip').addEventListener('input',()=>{if(num('paidTotal')>0)$('paidTotal').value='';preview()});$('paidTotal').addEventListener('input',recompute);$('baseTaxOverride').addEventListener('input',recompute);$('receiptTaxTotal').addEventListener('input',preview);$('receiptSubtotal').addEventListener('input',preview);$('desc').addEventListener('input',preview);$('payer').addEventListener('change',preview);
state.currentEventId=null;persist();render();
